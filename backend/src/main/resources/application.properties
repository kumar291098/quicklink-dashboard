spring.application.name=quicklink-dashboard-backend
quicklink.storage-dir=${user.home}/.quicklink-dashboard/data
spring.datasource.url=jdbc:h2:file:${quicklink.storage-dir}/quicklink-dashboard;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=58085
